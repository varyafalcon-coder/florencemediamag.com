# Ski areas for the /ski-season/ page.
# tier: near (up to ~2 h) | alps (4 to 5 h) | far (5 h and more)
# want: keys from the "wants" list at the bottom of this file.
areas:
  - id: abetone
    short: "Florence's home mountain. Wooden hotels, ski schools, no pretence."
    name: "Abetone"
    region: "Pistoia mountains, Tuscany"
    tier: near
    car: "1 h 50"
    train: "No practical option"
    size: "About 25 runs"
    pistes: [14, 29, 1]
    pistes_area: "Abetone, Val di Luce and Cutigliano"
    top: "1,900 m"
    pass: "51€ on weekdays (last season)"
    season: "4 Dec 2026 to 11 Apr 2027, snow permitting"
    vibe: "Florence's home mountain. A village on a pass with wooden hotels, ski schools full of Tuscan children and very little pretence. Weekdays are empty, Saturdays are a Florentine outing."
    go_if: "You have one free day, you are learning, or you are taking children for the first time."
    skip_if: "It has been a warm winter. Abetone depends on natural snow and snowmaking."
    want: [family, value, food]
    guide: "/articles/where-to-eat-and-stay-in-abetone/"
    guide_label: "Abetone: a day on the snow from Florence"
    photo: "/assets/photos/ski/abetone.jpg"
    photo_alt: "Pink light on the snowy ridge above the fir forests of Abetone"
    photo_credit: 'Photo: <a href="https://www.flickr.com/photos/13595478@N02/4541053174">lo.tangelini</a> via Flickr'

  - id: corno
    short: "Small, wild and often empty, inside a regional park."
    name: "Corno alle Scale"
    region: "Bologna Apennines, Emilia-Romagna"
    tier: near
    car: "2 h"
    train: "No practical option"
    size: "About 15 runs"
    pistes: [5, 7, 2]
    pistes_area: "The marked runs above Cavone"
    top: "1,950 m"
    pass: "28€ weekdays, 38€ weekends (latest published list)"
    season: "Planned 5 Dec 2026 to 29 Mar 2027"
    vibe: "Small and wild, inside a regional park on Bologna's side of the ridge. The lifts are old and the runs are short, but on a Tuscan weekend it is often the emptiest mountain within reach."
    go_if: "You want quiet slopes, a cheap day and a view across the whole Apennine ridge."
    skip_if: "You want variety. Three hours here and you have seen it all."
    want: [quiet, value]
    guide: "/articles/where-to-eat-and-stay-at-corno-alle-scale/"
    guide_label: "Corno alle Scale: small, wild and quiet"
    photo: "/assets/photos/ski/corno.jpg"
    photo_alt: "The Duca degli Abruzzi hut at Lago Scaffaiolo in the snow, below Corno alle Scale"
    photo_credit: 'Photo: <a href="https://www.flickr.com/photos/78368745@N00/70398589">Franco Pecchio</a> via Flickr'

  - id: cimone
    short: "The biggest in the Apennines, with tigelle in the huts."
    name: "Cimone"
    region: "Modena Apennines, Emilia-Romagna"
    tier: near
    car: "2 h 15"
    train: "No practical option"
    size: "About 50 km"
    pistes: [15, 25, 10]
    pistes_area: "Sestola, Passo del Lupo, Montecreto and Le Polle"
    top: "2,100 m"
    pass: "44€ weekdays, 57€ weekends"
    season: "Usually early December, snow permitting"
    vibe: "The biggest ski area in the Apennines, busy with Modena and Bologna at weekends. The mountain huts serve tigelle and tortelloni, and lunch is half the reason to come."
    go_if: "You want the most skiing you can do in a day from Florence, and a proper lunch."
    skip_if: "You want silence on a Saturday."
    want: [value, food, family]
    guide: "/articles/where-to-eat-and-stay-on-the-cimone/"
    guide_label: "The Cimone: skiing with the best food in the Apennines"
    photo: "/assets/photos/ski/cimone.jpg"
    photo_alt: "Skiers at a lift station in the snowy woods of the Cimone"
    photo_credit: 'Photo: <a href="https://www.flickr.com/photos/46383895@N00/357524774">Enrico Strocchi</a> via Flickr'

  - id: valgardena
    short: "Ladin villages, the Sellaronda, and you can come by train."
    name: "Val Gardena"
    region: "Dolomites, South Tyrol"
    tier: alps
    car: "4 h"
    train: "train to Bolzano, then bus 350 to Ortisei"
    size: "About 180 km, inside the 1,200 km of Dolomiti Superski"
    pistes: [52, 110, 19]
    pistes_area: "Val Gardena and Alpe di Siusi"
    top: "2,500 m"
    pass: "80€, 89€ in high season"
    season: "Late November to April"
    vibe: "Wooden Ladin villages under huge rock walls, mountain huts with real cooking, and the Sellaronda loop around the Sella massif. Ortisei has the evenings, Selva has the skiing."
    go_if: "It is your first Dolomites weekend, you want to arrive by train, or you want long days on the snow."
    skip_if: "You are on a tight budget."
    want: [big, nocar, food, apres, family]
    guide: "/articles/where-to-eat-and-stay-in-val-gardena/"
    guide_label: "Val Gardena: wooden villages and the Sellaronda"
    photo: "/assets/photos/ski/valgardena.jpg"
    photo_alt: "The Seceda chairlift above a sea of clouds in Val Gardena"
    photo_credit: 'Photo: <a href="https://commons.wikimedia.org/wiki/File:Lift_Seceda_Gherd%C3%ABina.jpg">Wolfgang Moroder</a> via Wikimedia Commons'

  - id: campiglio
    short: "Smart village, perfect red runs, aperitivo after skiing."
    name: "Madonna di Campiglio"
    region: "Brenta Dolomites, Trentino"
    tier: alps
    car: "4 h 15"
    train: "train to Trento, then bus"
    size: "About 155 km, linked to Pinzolo and Folgarida-Marilleva"
    pistes: [50, 72, 33]
    pistes_area: "Campiglio, Pinzolo, Folgarida and Marilleva"
    top: "2,500 m"
    pass: "75€ to 89€"
    season: "Late November to April"
    vibe: "Smart and polished: fur coats on the main street, perfectly groomed red runs, lifts a short walk from the centre. Lively in the evening without being loud."
    go_if: "You like well kept pistes, a pretty village and an aperitivo after skiing."
    skip_if: "You want rustic or cheap."
    want: [big, apres, nocar]
    guide: "/articles/where-to-eat-and-stay-in-madonna-di-campiglio/"
    guide_label: "Madonna di Campiglio: polished slopes under the Brenta"
    photo: "/assets/photos/ski/campiglio.jpg"
    photo_alt: "A snowy mountain hut above Madonna di Campiglio in late light"
    photo_credit: 'Photo: <a href="https://commons.wikimedia.org/wiki/File:Madonna_di_Campiglio%2C_Italy_%28Unsplash%29.jpg">Michal Průcha</a> via Wikimedia Commons'

  - id: pontedilegno
    short: "A real village below, a glacier at 3,000 m above. Good value."
    name: "Pontedilegno-Tonale"
    region: "Val Camonica, Lombardy, and Trentino"
    tier: alps
    car: "4 h 30"
    train: "train to Brescia, local line to Edolo, then bus"
    size: "About 100 km, up to the Presena glacier"
    pistes: [24, 60, 16]
    runs: [13, 25, 8]
    pistes_area: "Ponte di Legno, Tonale, Presena and Temù"
    top: "3,000 m"
    pass: "From 52€, 70€ at peak dates"
    season: "Late November to early May, the glacier among the first runs to open"
    vibe: "Two places on one lift pass. Ponte di Legno is a stone and wood village with a church square, shops and families who have come from Milan for three generations. Passo del Tonale above it is all snow, and the glacier at 3,000 metres keeps it white from November to May."
    go_if: "You want Alpine size and a glacier for less than the Dolomites, a real village to come back to, or snow when the Apennines have none."
    skip_if: "You want nightlife until four."
    want: [snow, value, family, quiet, big, nocar]
    guide: "/articles/where-to-eat-and-stay-in-ponte-di-legno/"
    guide_label: "Ponte di Legno and the Tonale: a weekend on the snow"
    photo: "/assets/photos/ski/pontedilegno.jpg"
    photo_alt: "Passo del Tonale at dusk, lights on under the snow"
    photo_credit: 'Photo: <a href="https://commons.wikimedia.org/wiki/File:Passo_del_Tonale_-_View_from_the_Top_Residence_-_panoramio.jpg">Zoran Kurelić Rabko</a> via Wikimedia Commons'

  - id: cortina
    short: "The glamour resort, with the most beautiful scenery."
    name: "Cortina d'Ampezzo"
    region: "Dolomites, Veneto"
    tier: alps
    car: "4 h 30"
    train: "train to Venice Mestre or Calalzo, then bus"
    size: "About 120 km in separate areas"
    pistes: [45, 59, 16]
    pistes_area: "Tofane, Cinque Torri, Faloria and Cristallo"
    top: "2,930 m"
    pass: "80€, 89€ in high season"
    season: "Late November to April"
    vibe: "The glamour resort, host of the 2026 Olympic women's alpine races. The evening walk along Corso Italia is part of the holiday, and the scenery at Cinque Torri and Lagazuoi is some of the most beautiful anywhere."
    go_if: "You want the views, the town and a dinner worth dressing for."
    skip_if: "You want to ski from one area to the next without a bus, or to spend little."
    want: [apres, big, food, nocar]
    guide: "/articles/where-to-eat-and-stay-in-cortina/"
    guide_label: "Cortina: the most beautiful skiing in the Dolomites"
    photo: "/assets/photos/ski/cortina.jpg"
    photo_alt: "The Cinque Torri ski area above Cortina in winter"
    photo_credit: 'Photo: <a href="https://commons.wikimedia.org/wiki/File:Cinque_Torri_Formin_Croda_da_Lago_Nuvolau.jpg">Wolfgang Moroder</a> via Wikimedia Commons'

  - id: altabadia
    short: "The most refined valley in the Dolomites, and the best lunches on any slope."
    name: "Alta Badia"
    region: "Dolomites, South Tyrol"
    tier: alps
    car: "4 h 45"
    train: "train to Brunico via Fortezza, then bus to Corvara"
    size: "About 130 km, inside the 1,200 km of Dolomiti Superski"
    pistes: [74, 47, 9]
    pistes_area: "Corvara, La Villa, San Cassiano and around"
    top: "2,778 m"
    pass: "75€ to 83€ (Alta Badia), more with Dolomiti Superski"
    season: "4 Dec 2026 to 4 Apr 2027"
    vibe: "Ladin villages, Corvara, La Villa and San Cassiano, under the Sassongher and the Sella. Wide, perfectly groomed runs, the Sellaronda from the doorstep, and the most serious eating in the Alps, from mountain huts to Michelin stars."
    go_if: "You want long, easy cruising, a lunch worth planning the day around, and a quiet, stylish village in the evening."
    skip_if: "You want late nights or steep, difficult runs."
    want: [food, big, quiet]
    guide: "/articles/where-to-eat-and-stay-in-alta-badia/"
    guide_label: "Alta Badia: the Dolomites at their most refined"
    photo: "/assets/photos/ski/altabadia.jpg"
    photo_alt: "Evening light over the Alta Badia ski slopes"
    photo_credit: 'Photo: <a href="https://commons.wikimedia.org/wiki/File:Piz_Bo%C3%A9_Alta_Badia_Italy_Landscape_Photography_%28188283153%29.jpeg">Giuseppe Milo</a> via Wikimedia Commons'

  - id: fassa
    short: "Sellaronda, the Marmolada glacier, and the closest of the Dolomites."
    name: "Val di Fassa"
    region: "Dolomites, Trentino"
    tier: alps
    car: "4 h"
    train: "train to Bolzano or Trento, then bus to Canazei"
    size: "About 110 km with Carezza, inside Dolomiti Superski"
    pistes: [38, 56, 13]
    pistes_area: "Val di Fassa and Carezza"
    top: "3,265 m on the Marmolada"
    pass: "80€, 89€ in high season (Dolomiti Superski)"
    season: "Late November to April"
    vibe: "A long valley of villages from Moena to Canazei, with the Sellaronda loop at the top end and the Marmolada glacier, the highest point of the Dolomites, a lift ride away. Lively, practical and full of skiing."
    go_if: "You want the most skiing for the drive, the Sellaronda, or the run down the Marmolada glacier."
    skip_if: "You want a pretty, quiet village. Canazei is busy."
    want: [big, snow, family, value]
    guide: "/articles/where-to-eat-and-stay-in-val-di-fassa/"
    guide_label: "Val di Fassa: the Sellaronda and the Marmolada"
    photo: "/assets/photos/ski/fassa.jpg"
    photo_alt: "Snowy slopes of the Belvedere above Canazei"
    photo_credit: 'Photo: <a href="https://commons.wikimedia.org/wiki/File:Canazei_Belvedere_-_panoramio.jpg">Pier B.</a> via Wikimedia Commons'

  - id: kronplatz
    short: "One mountain, perfect lifts, a museum and a chef at the top."
    name: "Plan de Corones (Kronplatz)"
    region: "Val Pusteria, South Tyrol"
    tier: alps
    car: "4 h 30"
    train: "train to Brunico via Fortezza; trains stop at the lifts"
    size: "About 125 km and 32 lifts"
    pistes: [60, 36, 29]
    pistes_area: "Every side of the mountain"
    top: "2,275 m"
    pass: "About 80€ (Kronplatz), more with Dolomiti Superski"
    season: "Late November to April"
    vibe: "A single round mountain covered in lifts, some of the most modern in the Alps, with long runs down every side. At the top: Messner's museum by Zaha Hadid, the Lumen photography museum and Norbert Niederkofler's restaurant."
    go_if: "You want to arrive by train, ski without queues, and spend an afternoon among museums at 2,275 metres."
    skip_if: "You want dramatic rock walls. It is greener and gentler than the Dolomites around it."
    want: [nocar, big, family, food]
    guide: "/articles/where-to-eat-and-stay-on-plan-de-corones/"
    guide_label: "Plan de Corones: one mountain, done perfectly"
    photo: "/assets/photos/ski/kronplatz.jpg"
    photo_alt: "Skiers on the Kronplatz above the clouds in the Puster valley"
    photo_credit: 'Photo: <a href="https://commons.wikimedia.org/wiki/File:Kronplatz_-_panoramio.jpg">ottori1982</a> via Wikimedia Commons'

  - id: cervinia
    short: "The highest skiing in Italy, under the Matterhorn."
    name: "Breuil-Cervinia"
    region: "Aosta Valley"
    tier: far
    car: "5 h"
    train: "train to Châtillon-Saint-Vincent, then bus"
    size: "About 160 km, 360 km with Zermatt"
    pistes: [39, 107, 12]
    pistes_area: "Breuil-Cervinia and Valtournenche, without Zermatt"
    top: "3,480 m"
    pass: "64€, 88€ with Zermatt"
    season: "Planned from 24 Oct 2026, one of the first in Europe"
    vibe: "The highest skiing in Italy, under the Matterhorn. Long, wide, gentle runs, and you can ski over to Switzerland for lunch. The village is no beauty and lively in the evening."
    go_if: "It is December and nothing else is white, or you want long cruising runs at altitude."
    skip_if: "You want steep, varied terrain, or you cannot spare a day: wind closes the top lifts and the Zermatt link more often than snow does, most of all in January."
    want: [snow, big, apres, family, nocar]
    guide: "/articles/where-to-eat-and-stay-in-cervinia/"
    guide_label: "Cervinia: skiing under the Matterhorn"
    photo: "/assets/photos/ski/cervinia.jpg"
    photo_alt: "Skiers on the glacier slopes above Cervinia"
    photo_credit: 'Photo: <a href="https://commons.wikimedia.org/wiki/File:Ski_and_shadows_%283213638186%29.jpg">photophilde</a> via Wikimedia Commons'

  - id: livigno
    short: "Young, cold, snow-sure, with the liveliest nights."
    name: "Livigno"
    region: "Valtellina, Lombardy"
    tier: far
    car: "5 h 30, over a high pass"
    train: "train to Milan, the line to Tirano, then a bus up to Livigno"
    size: "About 115 km and 30 lifts"
    pistes: [30, 65, 20]
    runs: [29, 37, 12]
    pistes_area: "Carosello 3000 and Mottolino"
    top: "2,798 m"
    pass: "51.50€ early and late season, 66€, 74.50€ in high season"
    season: "From 28 Nov 2026 to early May"
    vibe: "A long, high, cold valley with snow from November to May, snowparks that draw riders from all over Europe, duty-free shopping and the liveliest nights on this page."
    go_if: "You ride the park, you want snow in early December or late April, or you want a lively town after skiing."
    skip_if: "You want quiet slopes over Christmas and New Year, when Livigno is at its busiest, or a linked circuit like the Sellaronda. The two sides are not joined by lift."
    want: [apres, snow, big]
    guide: "/articles/where-to-eat-and-stay-in-livigno/"
    guide_label: "Livigno: high, cold and full of snow"
    photo: "/assets/photos/ski/livigno.jpg"
    photo_alt: "Livigno under fresh snow, wooden chalets and the mountains above"
    photo_credit: 'Photo: <a href="https://unsplash.com/@rmarte?utm_source=florence_media&utm_medium=referral">Rich Martello</a> on <a href="https://unsplash.com/?utm_source=florence_media&utm_medium=referral">Unsplash</a>'

  - id: courmayeur
    short: "Under Mont Blanc, with the smartest après-ski and hot springs below."
    name: "Courmayeur"
    region: "Aosta Valley, under Mont Blanc"
    tier: far
    car: "5 h"
    train: "train to Aosta, then bus to Courmayeur"
    size: "About 100 km, plus the Skyway to 3,466 m"
    pistes: [16, 21, 4]
    runs: [11, 17, 5]
    pistes_area: "Marked runs only, off-piste not counted"
    top: "2,755 m on the pistes"
    pass: "75€, 90€ with the Skyway Monte Bianco"
    season: "28 Nov 2026 to 11 Apr 2027"
    vibe: "An old mountaineering town at the foot of Mont Blanc, with a car-free main street, fur and fondue, and a famous lunch scene on the slopes above. The Skyway cable car climbs to 3,466 metres, and the hot pools of Pré-Saint-Didier are ten minutes away."
    go_if: "You want the most beautiful mountain in the Alps, a smart town in the evening, and a thermal bath after skiing."
    skip_if: "You want a big linked ski area. The pistes are good but not huge."
    want: [apres, food, snow]
    guide: "/articles/where-to-eat-and-stay-in-courmayeur/"
    guide_label: "Courmayeur: Mont Blanc, lunch and hot springs"
    photo: "/assets/photos/ski/courmayeur.jpg"
    photo_alt: "The Mont Blanc massif above Courmayeur in winter, from Val Ferret"
    photo_credit: 'Photo: <a href="https://commons.wikimedia.org/wiki/File:Amazing_Mont_Blanc_from_Val_Ferret%2C_winter%2C_Italy.jpg">Davide Tomatis</a> via Wikimedia Commons'

  - id: bormio
    short: "The Olympic downhill, a 3,000 m top and Roman thermal baths."
    name: "Bormio"
    region: "Valtellina, Lombardy"
    tier: far
    car: "5 h"
    train: "train to Milan, the line to Tirano, then bus to Bormio"
    size: "About 50 km"
    pistes: [16, 22, 12]
    runs: [10, 13, 7]
    pistes_area: "Bormio 2000 and Bormio 3000"
    top: "3,012 m"
    pass: "40€ in early December, 59€, 65€ at peak dates"
    season: "Early December to April"
    vibe: "A real medieval town with stone streets, the Stelvio piste where the men's downhill of the 2026 Olympics was raced, 1,800 metres of vertical, and thermal baths used since Roman times."
    go_if: "You want a long, steep run from 3,000 metres to town, and hot springs at the end of the day."
    skip_if: "You want a huge ski area. Fifty kilometres is enough for three days, not a week."
    want: [snow, value, quiet]
    guide: "/articles/where-to-eat-and-stay-in-bormio/"
    guide_label: "Bormio: the Olympic downhill and the thermal baths"
    photo: "/assets/photos/ski/bormio.jpg"
    photo_alt: "New Year torchlight descent on the Stelvio run at Bormio"
    photo_credit: 'Photo: <a href="https://commons.wikimedia.org/wiki/File:Fiaccolata_sulla_Pista_Stelvio_%28Bormio%29-_345679583.jpg">Luigi Rosa</a> via Wikimedia Commons'

wants:
  - { key: apres,  emoji: "🎉", label: "après-ski and nights out" }
  - { key: quiet,  emoji: "🌿", label: "quiet and slow" }
  - { key: family, emoji: "👨‍👩‍👧", label: "families and first-timers" }
  - { key: big,    emoji: "🏔️", label: "big terrain" }
  - { key: snow,   emoji: "❄️", label: "snow you can count on" }
  - { key: value,  emoji: "💶", label: "good value" }
  - { key: nocar,  emoji: "🚆", label: "without a car" }
  - { key: food,   emoji: "🍝", label: "food first" }

tiers:
  - { key: near, title: "Up to two hours", note: "The Apennines. Good for a day, cheap, and dependent on the snow." }
  - { key: alps, title: "Four to five hours", note: "The Alps for a long weekend. Snow on almost every run." }
  - { key: far,  title: "Five hours and more", note: "The high Alps. For three days or more, and for warm Decembers." }
