# Ski areas for the /ski-season/ page.
# tier: near (up to ~2 h) | alps (4 to 5 h) | far (5 h and more)
# want: keys from the "wants" list at the bottom of this file.
areas:
  - id: abetone
    short: "Florence's home mountain. Wooden hotels, ski schools, no pretence."
    name: "Abetone"
    region: "Pistoia mountains, Tuscany"
    tier: near
    car: "1 h 50"
    train: "No practical option"
    size: "About 25 runs"
    top: "1,900 m"
    pass: "51 € on weekdays (last season)"
    season: "4 Dec 2026 to 11 Apr 2027, snow permitting"
    vibe: "Florence's home mountain. A village on a pass with wooden hotels, ski schools full of Tuscan children and very little pretence. Weekdays are empty, Saturdays are a Florentine outing."
    go_if: "You have one free day, you are learning, or you are taking children for the first time."
    skip_if: "It has been a warm winter. Abetone depends on natural snow and snowmaking."
    want: [family, value, food]
    guide: "/articles/where-to-eat-and-stay-in-abetone/"
    guide_label: "Abetone: a day on the snow from Florence"

  - id: corno
    short: "Small, wild and often empty, inside a regional park."
    name: "Corno alle Scale"
    region: "Bologna Apennines, Emilia-Romagna"
    tier: near
    car: "2 h"
    train: "No practical option"
    size: "About 15 runs"
    top: "1,950 m"
    pass: "28 € weekdays, 38 € weekends (latest published list)"
    season: "Planned 5 Dec 2026 to 29 Mar 2027"
    vibe: "Small and wild, inside a regional park on Bologna's side of the ridge. The lifts are old and the runs are short, but on a Tuscan weekend it is often the emptiest mountain within reach."
    go_if: "You want quiet slopes, a cheap day and a view across the whole Apennine ridge."
    skip_if: "You want variety. Three hours here and you have seen it all."
    want: [quiet, value]

  - id: cimone
    short: "The biggest in the Apennines, with tigelle in the huts."
    name: "Cimone"
    region: "Modena Apennines, Emilia-Romagna"
    tier: near
    car: "2 h 15"
    train: "No practical option"
    size: "About 50 km"
    top: "2,100 m"
    pass: "44 € weekdays, 57 € weekends"
    season: "Usually early December, snow permitting"
    vibe: "The biggest ski area in the Apennines, busy with Modena and Bologna at weekends. The mountain huts serve tigelle and tortelloni, and lunch is half the reason to come."
    go_if: "You want the most skiing you can do in a day from Florence, and a proper lunch."
    skip_if: "You want silence on a Saturday."
    want: [value, food, family]
    guide: "/articles/where-to-eat-and-stay-on-the-cimone/"
    guide_label: "The Cimone: skiing with the best food in the Apennines"

  - id: valgardena
    short: "Ladin villages, the Sellaronda, and you can come by train."
    name: "Val Gardena"
    region: "Dolomites, South Tyrol"
    tier: alps
    car: "4 h"
    train: "train to Bolzano, then bus 350 to Ortisei"
    size: "About 175 km, inside the 1,200 km of Dolomiti Superski"
    top: "2,500 m"
    pass: "80 €, 89 € in high season"
    season: "Late November to April"
    vibe: "Wooden Ladin villages under huge rock walls, mountain huts with real cooking, and the Sellaronda loop around the Sella massif. Ortisei has the evenings, Selva has the skiing."
    go_if: "It is your first Dolomites weekend, you want to arrive by train, or you want long days on the snow."
    skip_if: "You are on a tight budget."
    want: [big, nocar, food, apres, family]
    guide: "/articles/where-to-eat-and-stay-in-the-dolomites/"
    guide_label: "The Dolomites from Florence: three valleys, three weekends"

  - id: campiglio
    short: "Smart village, perfect red runs, aperitivo after skiing."
    name: "Madonna di Campiglio"
    region: "Brenta Dolomites, Trentino"
    tier: alps
    car: "4 h 15"
    train: "train to Trento, then bus"
    size: "About 150 km, linked to Pinzolo and Folgarida-Marilleva"
    top: "2,500 m"
    pass: "75 € to 89 €"
    season: "Late November to April"
    vibe: "Smart and polished: fur coats on the main street, perfectly groomed red runs, lifts a short walk from the centre. Lively in the evening without being loud."
    go_if: "You like well kept pistes, a pretty village and an aperitivo after skiing."
    skip_if: "You want rustic or cheap."
    want: [big, apres, nocar]
    guide: "/articles/where-to-eat-and-stay-in-the-dolomites/"
    guide_label: "The Dolomites from Florence: three valleys, three weekends"

  - id: pontedilegno
    short: "A real village below, a glacier at 3,000 m above. Good value."
    name: "Pontedilegno-Tonale"
    region: "Val Camonica, Lombardy, and Trentino"
    tier: alps
    car: "4 h 30"
    train: "train to Brescia, local line to Edolo, then bus"
    size: "About 100 km, up to the Presena glacier"
    top: "3,000 m"
    pass: "From 52 €, 70 € at peak dates"
    season: "Late November to early May, the glacier among the first runs to open"
    vibe: "Two places on one lift pass. Ponte di Legno is a stone and wood village with a church square, shops and families who have come from Milan for three generations. Passo del Tonale above it is all snow, and the glacier at 3,000 metres keeps it white from November to May."
    go_if: "You want Alpine size and a glacier for less than the Dolomites, a real village to come back to, or snow when the Apennines have none."
    skip_if: "You want nightlife until four."
    want: [snow, value, family, quiet, big, nocar]
    guide: "/articles/where-to-eat-and-stay-in-ponte-di-legno/"
    guide_label: "Ponte di Legno and the Tonale: a weekend on the snow"

  - id: cortina
    short: "The glamour resort, with the most beautiful scenery."
    name: "Cortina d'Ampezzo"
    region: "Dolomites, Veneto"
    tier: alps
    car: "4 h 30"
    train: "train to Venice Mestre or Calalzo, then bus"
    size: "About 120 km in separate areas"
    top: "2,930 m"
    pass: "80 €, 89 € in high season"
    season: "Late November to April"
    vibe: "The glamour resort, host of the 2026 Olympic women's alpine races. The evening walk along Corso Italia is part of the holiday, and the scenery at Cinque Torri and Lagazuoi is some of the most beautiful anywhere."
    go_if: "You want the views, the town and a dinner worth dressing for."
    skip_if: "You want to ski from one area to the next without a bus, or to spend little."
    want: [apres, big, food, nocar]
    guide: "/articles/where-to-eat-and-stay-in-the-dolomites/"
    guide_label: "The Dolomites from Florence: three valleys, three weekends"

  - id: cervinia
    short: "The highest skiing in Italy, under the Matterhorn."
    name: "Breuil-Cervinia"
    region: "Aosta Valley"
    tier: far
    car: "5 h"
    train: "train to Châtillon-Saint-Vincent, then bus"
    size: "About 150 km, 360 km with Zermatt"
    top: "3,480 m"
    pass: "64 €, 88 € with Zermatt"
    season: "Planned from 24 Oct 2026, one of the first in Europe"
    vibe: "The highest skiing in Italy, under the Matterhorn. Long, wide, gentle runs, and you can ski over to Switzerland for lunch. The village is no beauty and lively in the evening."
    go_if: "It is December and nothing else is white, or you want long cruising runs at altitude."
    skip_if: "You want a pretty village."
    want: [snow, big, apres, family, nocar]
    guide: "/articles/where-to-eat-and-stay-in-cervinia/"
    guide_label: "Cervinia: skiing under the Matterhorn"

  - id: livigno
    short: "Young, cold, snow-sure, with the liveliest nights."
    name: "Livigno"
    region: "Valtellina, Lombardy"
    tier: far
    car: "5 h 30, over a high pass"
    train: "No practical option"
    size: "About 115 km and 30 lifts"
    top: "2,800 m"
    pass: "51.50 € early and late season, 66 €, 74.50 € in high season"
    season: "From 28 Nov 2026 to early May"
    vibe: "A long, high, cold valley with snow from November to May, snowparks that draw riders from all over Europe, duty-free shopping and the liveliest nights on this page."
    go_if: "You snowboard, you are young or feel it, and you want snow you can count on."
    skip_if: "You do not want to drive the last hour with chains."
    want: [apres, snow, big]

wants:
  - { key: apres,  emoji: "🎉", label: "après-ski and nights out" }
  - { key: quiet,  emoji: "🌿", label: "quiet and slow" }
  - { key: family, emoji: "👨‍👩‍👧", label: "families and first-timers" }
  - { key: big,    emoji: "🏔️", label: "big terrain" }
  - { key: snow,   emoji: "❄️", label: "snow you can count on" }
  - { key: value,  emoji: "💶", label: "good value" }
  - { key: nocar,  emoji: "🚆", label: "without a car" }
  - { key: food,   emoji: "🍝", label: "food first" }

tiers:
  - { key: near, title: "Up to two hours", note: "The Apennines. Good for a day, cheap, and dependent on the snow." }
  - { key: alps, title: "Four to five hours", note: "The Alps for a long weekend. Snow on almost every run." }
  - { key: far,  title: "Five hours and more", note: "The high Alps. For three days or more, and for warm Decembers." }
