# Cards in the From Florence section of the homepage.
# dist: hour | two | four. kind: eat | stay | see. url: optional article with more.
- title: La Taverna di San Giuseppe
  place: Siena
  dist: hour
  time: 1 h 10
  kind: eat
  text: Tuscan cooking in a room with Roman brick walls, over a wine cellar cut into an Etruscan house. Order the ribollita and the galletto al mattone.
  maps_q: La Taverna di San Giuseppe, Via Giovanni Duprè 132, Siena
- title: Piazza del Campo and the Torre del Mangia
  place: Siena
  dist: hour
  time: 1 h 10
  kind: see
  text: The shell-shaped square the Palio races around, and some 400 steps up the tower above it for the view over the roofs.
  maps_q: Torre del Mangia, Piazza del Campo, Siena
- title: Buca di Sant'Antonio
  place: Lucca
  dist: hour
  time: 1 h 10
  kind: eat
  text: A trattoria on Via della Cervia, a few steps from Piazza San Michele, cooking Tuscan classics for more than two hundred years. Handmade pasta, a good wine list.
  maps_q: Buca di Sant'Antonio, Via della Cervia 3, Lucca
- title: The walls of Lucca
  place: Lucca
  dist: hour
  time: 1 h 10
  kind: see
  text: Four kilometres of Renaissance walls with a tree-lined path along the top. Hire a bike in town and ride the whole circuit in half an hour.
  maps_q: Mura di Lucca, Lucca
- title: Osteria dei Cavalieri
  place: Pisa
  dist: hour
  time: 1 h 15
  kind: eat
  text: Tuscan food near Piazza dei Cavalieri, in the university part of Pisa that tourists at the tower never reach. Busy with locals, so book.
  maps_q: Osteria dei Cavalieri, Via San Frediano 16, Pisa
- title: Piazza dei Miracoli
  place: Pisa
  dist: hour
  time: 1 h 15
  kind: see
  text: The cathedral, the baptistery and the tower on one lawn. Book the climb up the tower online for a set time, or come early and see the square without it.
  maps_q: Piazza dei Miracoli, Pisa
- title: Cantina Senese
  place: Livorno
  dist: hour
  time: 1 h 20
  kind: eat
  text: A plain trattoria near the port for Livorno's fish cooking. The cacciucco, the city's fish stew, is a Friday dish, the mussels are good any day.
  maps_q: Cantina Senese, Borgo dei Cappuccini 95, Livorno
- title: Terrazza Mascagni
  place: Livorno
  dist: hour
  time: 1 h 20
  kind: see
  text: A long seafront terrace with a black and white chequered floor and the open sea in front. Come for the sunset, then walk back to the canals of the Venezia quarter.
  maps_q: Terrazza Mascagni, Livorno
- title: Enoteca Del Duca
  place: Volterra
  dist: hour
  time: 1 h 30
  kind: eat
  text: A family restaurant inside the walls of Volterra, listed in the Michelin guide, with classic Tuscan cooking and a cellar worth asking about.
  maps_q: Enoteca Del Duca, Via di Castello 2, Volterra
- title: The Roman theatre and the Guarnacci museum
  place: Volterra
  dist: hour
  time: 1 h 30
  kind: see
  text: A Roman theatre from the first century BC just below the walls, and a museum full of carved Etruscan funeral urns a few streets away.
  maps_q: Teatro Romano, Volterra
