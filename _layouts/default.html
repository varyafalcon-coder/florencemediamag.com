<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.seo_title %}{{ page.seo_title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.seo_description %}{{ page.seo_description }}{% else %}{{ page.answer | default: site.description }}{% endif %}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
<script type="application/ld+json">
{
  "@context":"https://schema.org","@type":"WebSite",
  "name":"{{ site.title }}","url":"{{ site.url }}",
  "inLanguage":"en","description":"{{ site.description }}",
  "publisher":{"@type":"Organization","name":"{{ site.title }}","url":"{{ site.url }}"}
}
</script>
{% if page.layout == 'place' %}
<script type="application/ld+json">
{
  "@context":"https://schema.org","@type":"LocalBusiness",
  "name":"{{ page.title }}",
  "description":"{{ page.answer }}",
  "url":"{{ page.url | absolute_url }}",
  "address":{"@type":"PostalAddress","addressLocality":"Florence","addressRegion":"Tuscany","addressCountry":"IT"}
}
</script>
{% endif %}
{% if page.faq %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[
{% for q in page.faq %}{"@type":"Question","name":{{ q.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ q.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}
]}
</script>
{% endif %}
</head>
<body>
{% include header.html %}
<main>{{ content }}</main>
{% include footer.html %}
</body>
</html>
