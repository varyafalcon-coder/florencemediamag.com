<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.seo_title %}{{ page.seo_title }}{% else %}{{ page.title }} | {{ site.title }}{% endif %}</title>
<meta name="description" content="{% if page.seo_description %}{{ page.seo_description }}{% else %}{{ page.answer | default: site.description }}{% endif %}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<link rel="icon" href="/favicon.ico?v=4" sizes="any">
<link rel="icon" type="image/png" sizes="144x144" href="/assets/icons/favicon-144.png?v=4">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96.png?v=4">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png?v=4">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png?v=4">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/icons/apple-touch-icon.png?v=4">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#1b2bb8">
<link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
<script type="application/ld+json">
{
  "@context":"https://schema.org","@type":"WebSite",
  "name":"{{ site.title }}","url":"{{ site.url }}",
  "inLanguage":"en","description":"{{ site.description }}",
  "publisher":{"@type":"Organization","name":"{{ site.title }}","url":"{{ site.url }}"}
}
</script>
{% if page.layout == 'place' %}
<script type="application/ld+json">
{
  "@context":"https://schema.org","@type":"LocalBusiness",
  "name":"{{ page.title }}",
  "description":"{{ page.answer }}",
  "url":"{{ page.url | absolute_url }}",
  "address":{"@type":"PostalAddress","addressLocality":"Florence","addressRegion":"Tuscany","addressCountry":"IT"}
}
</script>
{% endif %}
{% if page.faq %}
{% if page.layout == "article" %}
<script type="application/ld+json">
{
  "@context":"https://schema.org","@type":"Article",
  "headline":{{ page.title | jsonify }},
  "description":{{ page.seo_description | default: page.answer | jsonify }},
  "mainEntityOfPage":{"@type":"WebPage","@id":"{{ page.url | absolute_url }}"},
  "datePublished":"{{ page.published_on | default: '2026-08-01' }}",
  "dateModified":"{{ page.updated_on | default: page.published_on | default: '2026-08-31' }}",
  "author":{"@type":"Organization","name":"Florence Media","url":"{{ site.url }}"},
  "publisher":{"@type":"Organization","name":"Florence Media","url":"{{ site.url }}"},
  "isAccessibleForFree":true
}
</script>
{% endif %}
<script type="application/ld+json">
{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[
{% for q in page.faq %}{"@type":"Question","name":{{ q.q | jsonify }},"acceptedAnswer":{"@type":"Answer","text":{{ q.a | jsonify }}}}{% unless forloop.last %},{% endunless %}{% endfor %}
]}
</script>
{% endif %}
</head>
<body>
{% include header.html %}
<main>{{ content }}</main>
{% include footer.html %}
</body>
</html>
